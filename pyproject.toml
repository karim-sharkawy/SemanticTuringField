[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "STF"
version = "0.1.0"
description = "A dynamic 2D universe where words move, interact, and self-organize to visualize evolving meaning."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
  { name = "Karim El-Sharkawy", email = "karimelsharkawy2002@gmail.com" }
]
dependencies = [
  "numpy==2.4.4",
  "pandas==3.0.3",
  "scikit-learn==1.8.0",
  "matplotlib==3.10.9",
  "ipykernel==7.3.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "ruff>=0.15.12",
  "black>=24.8",
]
llm = [
  "torch>=2.3",
  "transformers>=4.44",
  "datasets>=2.20",
]

[project.scripts]
SelfCurate = "SelfCurate.cli:app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 99

[tool.ruff]
line-length = 99
target-version = "py310"
extend-exclude = [
    ".venv",
]

[tool.ruff.lint]
# Conservative ruleset: syntax errors, undefined names, unused imports, and
# obvious bugs - but nothing so opinionated it blocks day-to-day work.
select = ["E", "F", "W", "I"]
ignore = [
    "E402",  # Module level import not at top of file
    "E501",  # line length enforced by formatter
    "E731",  # allow lambda assignments
    "F841",  # Local variable is assigned to but never used
    "F405",  # `<VARIABLE_NAME>` may be undefined, or defined from star imports
    "F403",  # mainly for `from config import *` used; unable to detect undefined names
]

[tool.mypy]
python_version = "3.10"
warn_return_any = false
warn_unused_configs = true
ignore_missing_imports = true
allow_untyped_defs = true
allow_untyped_calls = true

# Gradually tighten these as you annotate more
check_untyped_defs = false
disallow_any_unimported = false
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra"
pythonpath = ["src"]